<!-- ============================ ENGINE (don't edit) ============================ -->
<script>
(() => {
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = {
    out: (p) => 1 - Math.pow(1 - p, 3),
    inOut: (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    back: (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  };
  const num = (el, k, d) => el.dataset[k] !== undefined ? parseFloat(el.dataset[k]) : d;
  const TRANS = 0.35;

  // deterministic pseudo-random (frames must be identical for the same t)
  const rand = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  const scenes = [...document.querySelectorAll('.scene')].map((el, i) => ({
    el, i, start: num(el, 'start', 0), end: num(el, 'end', 1), trans: el.dataset.trans || 'cut',
  }));
  const duration = window.VIDEO.duration || Math.max(...scenes.map((s) => s.end));
  window.VIDEO.duration = duration;

  // split kinetic letters into spans (words kept together)
  document.querySelectorAll('[data-anim~="letters"]').forEach((el) => {
    let i = 0; el.innerHTML = el.textContent.trim().split(/\s+/).map((w) => '<span style="display:inline-block;white-space:nowrap">' +
      [...w].map((c) => `<span class="l" data-i="${i++}" style="display:inline-block;transform-origin:50% 100%">${c}</span>`).join('') + '</span>').join(' ');
  });
  // split karaoke captions into word spans
  document.querySelectorAll('[data-anim~="words"]').forEach((el) => {
    el.classList.add('words');
    el.innerHTML = el.textContent.trim().split(/\s+/).map((w) => `<span class="w">${w}</span>`).join(' ');
  });
  // wind / speed streak backgrounds
  document.querySelectorAll('.fx-streaks').forEach((el, k) => {
    el.style.cssText += 'position:absolute;inset:0;';
    const n = num(el, 'count', 30);
    for (let i = 0; i < n; i++) {
      const s = document.createElement('i'); s.className = 'streak';
      s.dataset.seed = k * 100 + i;
      s.style.left = (rand(k * 100 + i) * 1080) + 'px';
      s.style.height = (120 + rand(i + 7) * 260) + 'px';
      s.style.opacity = .25 + rand(i + 3) * .6;
      el.appendChild(s);
    }
  });

  function animate(el, lt, sceneLen) {
    const kinds = (el.dataset.anim || '').split(/\s+/).filter(Boolean);
    const at = num(el, 'at', 0), dur = num(el, 'dur', .5);
    const p = clamp((lt - at) / dur);
    let op = 1, tf = '';
    for (const k of kinds) {
      switch (k) {
        case 'fade': op *= ease.out(p); break;
        case 'up': op *= ease.out(p); tf += ` translateY(${(1 - ease.out(p)) * 120}px)`; break;
        case 'down': op *= ease.out(p); tf += ` translateY(${-(1 - ease.out(p)) * 120}px)`; break;
        case 'left': op *= ease.out(p); tf += ` translateX(${(1 - ease.out(p)) * 300}px)`; break;
        case 'right': op *= ease.out(p); tf += ` translateX(${-(1 - ease.out(p)) * 300}px)`; break;
        case 'pop': op *= clamp(p * 3); tf += ` scale(${.3 + .7 * ease.back(p)})`; break;
        case 'zoom': op *= ease.out(p); tf += ` scale(${1.5 - .5 * ease.out(p)})`; break;
        case 'spin': op *= ease.out(p); tf += ` rotate(${(1 - ease.out(p)) * -180}deg)`; break;
        case 'shake': { const a = 22 * Math.max(0, 1 - (lt - at) / 0.8); tf += ` translateX(${Math.sin(lt * 70) * a}px) rotate(${Math.sin(lt * 53) * a * .15}deg)`; break; }
        case 'pulse': if (lt > at + dur) tf += ` scale(${1 + .05 * Math.sin((lt - at - dur) * 7)})`; break;
        case 'strike': el.classList.add('strike'); el.style.setProperty('--strike', ease.out(p)); break;
        case 'squash': { const q = lt - at; if (q < 0) { op = 0; break; } const k = Math.exp(-6 * q) * Math.cos(13 * q);
          op *= clamp(q * 8); tf += ` scale(${1 + .38 * k}, ${1 - .38 * k})`; break; }
        case 'glow': { const g = clamp((lt - at) / dur); el.style.textShadow = g > 0 ? `0 0 ${(18 + 14 * Math.sin(lt * 4)) * g}px var(--glow, var(--accent)), 0 0 ${(50 + 30 * Math.sin(lt * 4)) * g}px var(--glow, var(--accent))` : ''; break; }
        case 'blur': op *= ease.out(p); el.style.filter = p < 1 ? `blur(${(1 - ease.out(p)) * 30}px)` : ''; break;
        case 'draw': { const L = el.getTotalLength(); el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - ease.inOut(p)); break; }
        case 'reveal': { const e = ease.out(p); el.style.clipPath = `inset(${-10}% -10% ${(1 - e) * 110 - 10}% -10%)`; tf += ` translateY(${(1 - e) * 40}%)`; break; }
        case 'letters': { const step = num(el, 'step', .035);
          el.querySelectorAll('.l').forEach((c) => { const q = (lt - at - (+c.dataset.i) * step);
            if (q < 0) { c.style.opacity = 0; return; } const k = Math.exp(-7 * q) * Math.cos(15 * q);
            c.style.opacity = clamp(q * 10); c.style.transform = `scale(${1 - .45 * k}, ${1 + .6 * k}) translateY(${Math.max(0, 1 - q * 5) * 30}px)`; });
          break; }
        case 'float': tf += ` translateY(${Math.sin(lt * 2.4) * 28}px) rotate(${Math.sin(lt * 1.7) * 4}deg)`; break;
        case 'words': {
          const step = num(el, 'step', .18), ws = el.querySelectorAll('.w');
          ws.forEach((w, i) => {
            const wp = clamp((lt - at - i * step) / .22);
            w.style.opacity = clamp(wp * 3);
            w.style.transform = `scale(${.5 + .5 * ease.back(wp)})`;
            w.classList.toggle('now', lt >= at + i * step && lt < at + (i + 1) * step + .05);
          });
          break;
        }
      }
    }
    const out = num(el, 'out', null);
    if (out !== null) op *= 1 - clamp((lt - out) / .3);
    el.style.opacity = op;
    el.style.transform = tf;
  }

  function sceneTransition(s, lt) {
    const p = ease.out(clamp(lt / TRANS));
    const st = s.el.style;
    st.opacity = 1; st.transform = ''; st.filter = ''; st.clipPath = '';
    if (s.i === 0) return;
    switch (s.trans) {
      case 'fade': st.opacity = p; break;
      case 'slide': st.transform = `translateX(${(1 - p) * 100}%)`; break;
      case 'up': st.transform = `translateY(${(1 - p) * 100}%)`; break;
      case 'zoom': st.opacity = p; st.transform = `scale(${1.25 - .25 * p})`; break;
      case 'whip': st.transform = `translateX(${(1 - p) * -100}%)`; st.filter = p < 1 ? `blur(${(1 - p) * 30}px)` : ''; break;
      case 'flip': if (p < 1) { st.transform = `perspective(2200px) rotateY(${(1 - p) * -100}deg)`; st.transformOrigin = '0% 50%'; } else st.transformOrigin = ''; break;
      case 'iris': if (p < 1) st.clipPath = `circle(${p * 120}% at ${s.el.dataset.irisX || '50%'} ${s.el.dataset.irisY || '50%'})`; break;
      case 'wipe': if (p < 1) st.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; break;
      case 'wipeup': if (p < 1) st.clipPath = `inset(${(1 - p) * 100}% 0 0 0)`; break;
    }
  }

  // particles (deterministic floating dots)
  document.querySelectorAll('.fx-particles').forEach((el, k) => {
    el.style.cssText += 'position:absolute;inset:0;pointer-events:none;';
    const n = num(el, 'count', 40);
    for (let i = 0; i < n; i++) { const d = document.createElement('i'); const r = 3 + rand(k * 50 + i) * 9;
      d.style.cssText = `position:absolute;width:${r}px;height:${r}px;border-radius:50%;background:${el.dataset.color || '#fff'};filter:blur(${rand(i + 9) * 3}px)`;
      d.dataset.seed = k * 50 + i; el.appendChild(d); }
  });
  // embedded video clips (e.g. a rendered 3D shot): <video data-clip data-at="0.2" src="..." muted>
  const clips = [...document.querySelectorAll('video[data-clip]')];
  if (clips.length) {
    window.VIDEO_READY = false;
    Promise.all(clips.map((v) => { v.muted = true; v.preload = 'auto'; v.pause();
      return v.readyState >= 2 ? null : new Promise((r) => { v.addEventListener('loadeddata', r, { once: true }); v.load(); }); }))
      .then(() => { window.VIDEO_READY = true; });
  }
  const seek = (v, time) => new Promise((r) => {
    if (Math.abs(v.currentTime - time) < 0.001) return r();
    v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = time; });

  window.renderFrame = async (t) => {
    const waits = [];
    for (const s of scenes) {
      const tail = s.i < scenes.length - 1 ? TRANS : 0;
      const on = t >= s.start && t < s.end + tail;
      s.el.style.display = on ? 'block' : 'none';
      s.el.style.zIndex = s.i + 1;
      if (!on) continue;
      const lt = t - s.start, len = s.end - s.start;
      sceneTransition(s, lt);
      // camera: data-cam="push" (slow push-in), "pull", "drift" on the scene's first child wrapper .cam
      const cam = s.el.querySelector(':scope > .cam'); if (cam) { const k = clamp(lt / (len + TRANS)), m = s.el.dataset.cam || 'push';
        cam.style.transform = m === 'pull' ? `scale(${1.08 - .08 * k})` : m === 'drift' ? `scale(1.06) translate(${(k - .5) * -30}px, ${(k - .5) * -12}px)` : `scale(${1 + .07 * k})`; }
      // parallax: data-par="0.6" drifts an element up at that speed (px per 0.01s * 10)
      s.el.querySelectorAll('[data-par]').forEach((el) => { el.style.translate = `0 ${-lt * 40 * parseFloat(el.dataset.par)}px`; });
      s.el.querySelectorAll('[data-anim]').forEach((el) => animate(el, lt, len));
      s.el.querySelectorAll('[data-kb]').forEach((el) => {
        const p = ease.inOut(clamp(lt / len)), m = el.dataset.kb;
        el.style.transform = m === 'out' ? `scale(${1.18 - .18 * p})`
          : m === 'left' ? `scale(1.12) translateX(${(.5 - p) * 6}%)`
          : m === 'right' ? `scale(1.12) translateX(${(p - .5) * 6}%)`
          : `scale(${1 + .18 * p})`;
      });
      s.el.querySelectorAll('[data-count]').forEach((el) => {
        const [a, b, d] = el.dataset.count.split(':').map(Number);
        const p = ease.out(clamp((lt - num(el, 'at', 0)) / num(el, 'dur', 1)));
        el.textContent = (a + (b - a) * p).toFixed(d || 0);
      });
      s.el.querySelectorAll('[data-follow]').forEach((el) => {
        const path = document.getElementById(el.dataset.follow); const L = path.getTotalLength();
        const p = ease.inOut(clamp((lt - num(el, 'at', 0)) / num(el, 'dur', 1)));
        const pt = path.getPointAtLength(L * p); el.setAttribute('cx', pt.x); el.setAttribute('cy', pt.y);
      });
      s.el.querySelectorAll('.fx-particles').forEach((fx) => {
        fx.querySelectorAll('i').forEach((d) => { const sd = +d.dataset.seed;
          const y = (rand(sd + 1) * 2100 - t * (30 + rand(sd + 2) * 70)) % 2100; const yy = y < 0 ? y + 2100 : y;
          d.style.left = (rand(sd + 3) * 1080 + Math.sin(t * (0.5 + rand(sd + 4)) + sd) * 30) + 'px';
          d.style.top = (yy - 90) + 'px'; d.style.opacity = (.15 + .5 * rand(sd + 6)) * (.6 + .4 * Math.sin(t * 2 + sd)); });
      });
      s.el.querySelectorAll('video[data-clip]').forEach((v) => {
        const at = num(v, 'at', 0), d = v.duration || 0;
        if (location.search.includes('render=1')) waits.push(seek(v, clamp(lt - at, 0, Math.max(0, d - 0.034))));
        else if (lt >= at && v.paused) v.play().catch(() => {});
      });
      s.el.querySelectorAll('.fx-streaks').forEach((fx) => {
        const speed = num(fx, 'speed', 900);
        fx.querySelectorAll('.streak').forEach((st) => {
          const seed = +st.dataset.seed, h = parseFloat(st.style.height);
          const y = ((rand(seed + 11) * 2200 + t * speed * (.6 + rand(seed + 5) * .8)) % (1920 + h)) - h;
          st.style.top = (1920 - y - h) + 'px'; // streaks rush UPWARD (wind)
        });
      });
    }
    // persistent overlays across scenes: <div class="hud" data-from="3" data-to="25">…</div> (absolute seconds)
    document.querySelectorAll('.hud').forEach((h) => {
      const f = num(h, 'from', 0), to = num(h, 'to', 1e9);
      const p = clamp((t - f) / .3) * (1 - clamp((t - to) / .3));
      h.style.opacity = p; h.style.transform = `translateY(${(1 - ease.out(clamp((t - f) / .4))) * -40}px)`; h.style.zIndex = 900;
    });
    const bar = document.querySelector('#progress i');
    if (bar) bar.style.width = (100 * t / duration) + '%';
    // custom per-page animation (characters, levers, charts): window.onFrame = (t, lt) => {...}
    if (typeof window.onFrame === 'function') window.onFrame(t);
    await Promise.all(waits);
  };

  // ---- preview mode (open the file in a browser) ----
  if (!location.search.includes('render=1')) {
    const stage = document.getElementById('stage');
    const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920);
      stage.style.transform = `scale(${k})`; document.body.style.height = innerHeight + 'px'; };
    addEventListener('resize', fit); fit();
    let t = 0, last = performance.now(), paused = false;
    addEventListener('keydown', (e) => {
      if (e.code === 'Space') paused = !paused;
      if (e.key === 'ArrowRight') t = Math.min(duration, t + .5);
      if (e.key === 'ArrowLeft') t = Math.max(0, t - .5);
      if (e.key === 'r') t = 0;
    });
    const loop = (now) => { if (!paused) t = (t + (now - last) / 1000) % duration; last = now;
      window.renderFrame(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    window.renderFrame(0);
  }
})();
</script>
</body>
</html>
